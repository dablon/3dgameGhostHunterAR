<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>👻 Ghost Hunter AR</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --fg: #e8eef7;
        --accent: #6ad4ff;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #app canvas:active {
        cursor: grabbing;
      }
      .hud {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        padding: 10px 12px;
        background: rgba(11, 14, 20, 0.7);
        border: 1px solid rgba(106, 212, 255, 0.3);
        border-radius: 8px;
        backdrop-filter: blur(8px);
        max-width: 320px;
        pointer-events: none;
      }
      .hud h1 {
        margin: 0 0 6px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--accent);
        text-transform: uppercase;
      }
      .hud kbd {
        display: inline-block;
        padding: 1px 5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .hud ul {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 12px;
        opacity: 0.85;
      }
      .hud li {
        margin: 2px 0;
      }
      .loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--bg);
        z-index: 100;
        transition: opacity 0.4s ease;
      }
      .loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loading .spin {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(106, 212, 255, 0.2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .err {
        position: fixed;
        inset: 12px;
        z-index: 200;
        padding: 12px 16px;
        background: #2a0f12;
        border: 1px solid #ff5d6c;
        border-radius: 8px;
        color: #ffd7da;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud" id="hud" hidden>
      <h1>👻 Ghost Hunter</h1>
      <ul>
        <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &middot; <kbd>Q</kbd>/<kbd>E</kbd> up/down</li>
        <li><kbd>Click</kbd> lock mouse &middot; look to aim</li>
        <li><kbd>LMB</kbd> / <kbd>Space</kbd> fire proton beam</li>
        <li><kbd>Shift</kbd> boost speed</li>
      </ul>
      <div class="stats">
        <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score-value">0</span></div>
        <div class="stat"><span class="stat-label">Kills</span><span class="stat-value" id="kills-value">0</span></div>
        <div class="stat"><span class="stat-label">Ghosts</span><span class="stat-value" id="ghost-count">0</span></div>
      </div>
    </div>
    <style>
      .stats {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
      }
      .stat-label {
        color: rgba(106, 212, 255, 0.7);
      }
      .stat-value {
        color: #fff;
        font-family: ui-monospace, monospace;
        font-weight: 600;
      }
    </style>
    <div class="loading" id="loading"><div class="spin"></div></div>
    <noscript>
      <p style="padding: 24px">This game requires JavaScript and WebGL2.</p>
    </noscript>
    <script type="module" src="/src/composition/main.ts"></script>
  </body>
</html>
